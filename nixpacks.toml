[phases.install]
cmds = ["npm ci"]

[phases.build]
cmds = ["npx prisma generate", "npm run build"]

[start]
# migrate deploy antes de arrancar: aplica migraciones pendientes en cada
# release. Sin esto, una migracion nueva nunca llega a produccion.
cmd = "npx prisma migrate deploy && npm run start"

[options]
no-cache = true
